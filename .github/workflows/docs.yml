name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Validar docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Arquivos essenciais do portal
        run: |
          test -f docs/index.html
          test -f docs/_sidebar.md
          test -f docs/_coverpage.md
          test -f docs/home.md
          test -f docs/architecture.md
          test -f docs/00-biblia-do-mundo.md
          echo "Portal OK"

  deploy:
    name: GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Preparar artefato (pasta docs)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
